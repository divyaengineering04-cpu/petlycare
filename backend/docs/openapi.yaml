openapi: 3.0.3
info:
  title: PetlyCare API
  version: 1.0.0
  description: REST API for pet profiles, care services, bookings, reminders, and marketplace listings.
servers:
  - url: http://localhost:5004
    description: Local development server
tags:
  - name: Health
  - name: Authentication
  - name: Pets
  - name: Services
  - name: Bookings
  - name: Marketplace
  - name: Reminders
  - name: Emergency
  - name: Seed
paths:
  /:
    get:
      tags: [Health]
      summary: API status
      responses:
        '200':
          description: Server status
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Healthy server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in with a registered email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/profile:
    put:
      tags: [Authentication]
      summary: Update the current user profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/pets:
    get:
      tags: [Pets]
      summary: List the current user's pets
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pet list
    post:
      tags: [Pets]
      summary: Add a pet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
      responses:
        '201':
          description: Pet created
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/pets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pets]
      summary: Get a pet
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pet details }
        '404': { description: Pet not found }
    put:
      tags: [Pets]
      summary: Update a pet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
      responses:
        '200': { description: Pet updated }
    delete:
      tags: [Pets]
      summary: Delete a pet
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pet deleted }
  /api/services:
    get:
      tags: [Services]
      summary: List available services
      responses:
        '200': { description: Service list }
  /api/services/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Services]
      summary: Get a service
      responses:
        '200': { description: Service details }
        '404': { description: Service not found }
  /api/bookings:
    get:
      tags: [Bookings]
      summary: List the current user's bookings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Booking list }
    post:
      tags: [Bookings]
      summary: Create a booking
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201': { description: Booking created }
  /api/bookings/{id}/pay:
    post:
      tags: [Bookings]
      summary: Pay for a booking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Booking paid }
  /api/bookings/{id}/cancel:
    put:
      tags: [Bookings]
      summary: Cancel a booking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Booking cancelled }
  /api/marketplace:
    get:
      tags: [Marketplace]
      summary: List marketplace pets
      responses:
        '200': { description: Marketplace listing list }
    post:
      tags: [Marketplace]
      summary: Create a marketplace listing
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201': { description: Listing created }
  /api/marketplace/{id}/buy:
    post:
      tags: [Marketplace]
      summary: Buy a marketplace pet
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Pet purchased }
  /api/reminders:
    get:
      tags: [Reminders]
      summary: List the current user's reminders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reminder list }
    post:
      tags: [Reminders]
      summary: Add a reminder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201': { description: Reminder created }
  /api/reminders/{id}/toggle:
    patch:
      tags: [Reminders]
      summary: Toggle reminder status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Reminder updated }
  /api/reminders/{id}:
    delete:
      tags: [Reminders]
      summary: Delete a reminder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Reminder deleted }
  /api/emergency:
    get:
      tags: [Emergency]
      summary: List emergency contacts
      responses:
        '200': { description: Emergency contact list }
  /api/seed:
    post:
      tags: [Seed]
      summary: Reset and seed the database
      description: Development-only endpoint. This deletes existing application data before seeding.
      responses:
        '200': { description: Database seeded }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        timestamp: { type: string, format: date-time }
    Error:
      type: object
      properties:
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        avatar: { type: string, format: uri }
        createdAt: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, format: password, minLength: 6 }
        address: { type: string }
        avatar: { type: string, format: uri }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    ProfileUpdateRequest:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        avatar: { type: string, format: uri }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: '#/components/schemas/User'
    PetRequest:
      type: object
      required: [name, type, breed, age, gender, weight, vaccinationStatus]
      properties:
        name: { type: string }
        type: { type: string }
        breed: { type: string }
        age: { type: string }
        gender: { type: string }
        weight: { type: string }
        vaccinationStatus: { type: string }
        image: { type: string, format: uri }
        notes: { type: string }
